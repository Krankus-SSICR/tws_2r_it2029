<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS - Flexbox</h1>

    <h2>flex-direction</h2>

    <h3>flex-direction: row;</h3>
    <div class="parent" style="flex-direction: row;">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
        <div class="child">7</div>
        <div class="child">8</div>
    </div>

    <h3>flex-direction: row;</h3>
    <div class="parent" style="flex-direction: row-reverse;">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
        <div class="child">7</div>
        <div class="child">8</div>
    </div>

    <h3>flex-direction: column;</h3>
    <div class="parent" style="flex-direction: column;">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
        <div class="child">7</div>
        <div class="child">8</div>
    </div>

    <h3>flex-direction: column-reverse;</h3>
    <div class="parent" style="flex-direction: column-reverse;">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
        <div class="child">7</div>
        <div class="child">8</div>
    </div>

    <h2>jusify-content</h2>
    <h3>justify-content: cener;</h3>
    <div class="parent" style="justify-content: center;">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
        <div class="child">7</div>
        <div class="child">8</div>
    </div>

</body>
</html>
