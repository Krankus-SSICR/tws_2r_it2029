<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS přechody a animace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>CSS přechody a animace</h1>

<h2>1. Přechody – transition</h2>

<div class="grid">
    <div class="card">
        <h3>Barva</h3>
        <div class="demo"><div class="box t-color"></div></div>
    </div>

    <div class="card">
        <h3>Velikost</h3>
        <div class="demo"><div class="box t-size"></div></div>
    </div>

    <div class="card">
        <h3>Otočení</h3>
        <div class="demo"><div class="box t-rotate"></div></div>
    </div>

    <div class="card">
        <h3>Posun</h3>
        <div class="demo"><div class="box t-move"></div></div>
    </div>

    <div class="card">
        <h3>Průhlednost</h3>
        <div class="demo"><div class="box t-opacity"></div></div>
    </div>

    <div class="card">
        <h3>Zaoblení</h3>
        <div class="demo"><div class="box t-radius"></div></div>
    </div>
</div>

<h2>2. Animace – @keyframes</h2>

<div class="grid">
    <div class="card">
        <h3>Barva</h3>
        <div class="demo"><div class="box a-color"></div></div>
    </div>

    <div class="card">
        <h3>Velikost</h3>
        <div class="demo"><div class="box a-size"></div></div>
    </div>

    <div class="card">
        <h3>Otočení</h3>
        <div class="demo"><div class="box a-rotate"></div></div>
    </div>

    <div class="card">
        <h3>Posun</h3>
        <div class="demo"><div class="box a-move"></div></div>
    </div>

    <div class="card">
        <h3>Průhlednost</h3>
        <div class="demo"><div class="box a-opacity"></div></div>
    </div>

    <div class="card">
        <h3>Zaoblení</h3>
        <div class="demo"><div class="box a-radius"></div></div>
    </div>
</div>

</body>
</html>
