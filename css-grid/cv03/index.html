<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS GRID - 12 sloupců</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Grid se 12 sloupci</h1>

    <section>
        <h2>1. Mřížka 12 sloupců</h2>
        <div class="grid">
            <div class="sloupec">1</div>
            <div class="sloupec">2</div>
            <div class="sloupec">3</div>
            <div class="sloupec">4</div>
            <div class="sloupec">5</div>
            <div class="sloupec">6</div>
            <div class="sloupec">7</div>
            <div class="sloupec">8</div>
            <div class="sloupec">9</div>
            <div class="sloupec">10</div>
            <div class="sloupec">11</div>
            <div class="sloupec">12</div>
        </div>
    </section>

    <section>
        <h2>2. Roztažení přes sloupce pomocí span</h2>
        <div class="grid">
            <!-- jedna buňka přes 12 sloupců -->
            <div class="box span-12">span 12</div>
            <!-- 6 + 6 -->
            <div class="box span-6">span 6</div>
            <div class="box span-6">span 6</div>
            <!-- 4 + 4 + 4 -->
            <div class="box span-4">span 4</div>
            <div class="box span-4">span 4</div>
            <div class="box span-4">span 4</div>
        </div>
    </section>

    <section>
        <h2>3. Umístění podle čar (start / konec)</h2>
        <div class="grid">
            <div class="box cara-1">1 / 5</div>
            <div class="box cara-2">5 / 13</div>
            <div class="box cara-3">3 / 11</div>
        </div>
    </section>

    <section>
        <h2>4. Rozvržení stránky</h2>
        <div class="grid stranka">
            <header class="hlavicka">header</header>
            <nav class="menu">nav</nav>
            <div class="levy-panel">Levý panel</div>
            <main class="obsah">main</main>
            <div class="pravy-panel">Pravý panel</div>
            <footer class="paticka">footer</footer>
        </div>
    </section>
</body>

</html>
